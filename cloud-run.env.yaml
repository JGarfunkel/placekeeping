# Non-secret Cloud Run env vars — mirrors the "# config options" section of
# .env (see that file). Safe to commit: nothing here is sensitive. Actual
# secrets (DATABASE_URL, API keys, private keys, etc.) come from Secret
# Manager via --set-secrets instead — see CLOUD_RUN_DEPLOY.md.
NODE_ENV: "production"
EMAIL_PROVIDER: "local"
IMAGE_STORAGE: "r2"
DEFAULT_MAP_CENTER_LAT: "41.1564637"
DEFAULT_MAP_CENTER_LNG: "-73.7775712"
# LOCAL_UPLOADS_BASE_URL intentionally omitted: only read when
# IMAGE_STORAGE=local (see .env.example), which prod doesn't use.
