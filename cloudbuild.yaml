# Cloud Build config for apps/web. Used by a Cloud Build trigger
# (Configuration: "Cloud Build configuration file") — see
# apps/web/CLOUD_RUN_DEPLOY.md for the full deploy flow and why the
# NEXT_PUBLIC_* build args exist. Builds, pushes, then deploys to Cloud Run.
#
# The deploy step discovers secret names from Secret Manager itself
# (`gcloud secrets list`) rather than from .env, since .env is gitignored
# and never reaches the build — same NAME=NAME:latest convention the
# manual deploy flow in CLOUD_RUN_DEPLOY.md uses, just run inside the
# build instead of by hand. Requires the trigger's service account to
# have roles/run.admin, roles/secretmanager.viewer (project-level), and
# roles/iam.serviceAccountUser on the Cloud Run runtime service account —
# see CLOUD_RUN_DEPLOY.md for the exact grant commands.
#
# Most _MAPS_*/_FIREBASE_* substitutions below are committed with real
# values on purpose: NEXT_PUBLIC_* vars are inlined into the client JS
# bundle, so they're readable by any visitor in page source regardless —
# same reason .env's own secrets:push script skips them (see the
# "# config options" marker in .env).
#
# Exception: _MAPS_KEY and _FIREBASE_API_KEY are left blank here even
# though they're just as public at runtime — they're API-key-shaped
# strings (Google's "AIzaSy..." format), and GitHub's secret scanning
# flags/quarantines those on sight regardless of actual sensitivity. Set
# both in the trigger's substitution variables instead (Console → trigger
# → Substitution variables) rather than committing them.

substitutions:
  _REGION: us-east4
  _REPO: placekeeping
  _SERVICE: placekeeping-web
  _MAPS_KEY: ""
  _MAPS_MAP_ID: "112da5005f01d08e486aec86"
  _FIREBASE_API_KEY: ""
  _FIREBASE_AUTH_DOMAIN: "placekeeping-51b17.firebaseapp.com"
  _FIREBASE_PROJECT_ID: "placekeeping-51b17"
  _FIREBASE_APP_ID: "1:621685629726:web:13a241637845c13c0edf0f"

steps:
  - name: gcr.io/cloud-builders/docker
    args:
      - build
      - -f
      - Dockerfile
      - --build-arg=NEXT_PUBLIC_GOOGLE_MAPS_API_KEY=$_MAPS_KEY
      - --build-arg=NEXT_PUBLIC_GOOGLE_MAPS_MAP_ID=$_MAPS_MAP_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_API_KEY=$_FIREBASE_API_KEY
      - --build-arg=NEXT_PUBLIC_FIREBASE_AUTH_DOMAIN=$_FIREBASE_AUTH_DOMAIN
      - --build-arg=NEXT_PUBLIC_FIREBASE_PROJECT_ID=$_FIREBASE_PROJECT_ID
      - --build-arg=NEXT_PUBLIC_FIREBASE_APP_ID=$_FIREBASE_APP_ID
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA
      - -t
      - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/web:latest
      - .

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk:slim
    entrypoint: bash
    args:
      - -c
      - |
        # $$-escaped below wherever a bash-runtime variable is meant, not a
        # Cloud Build substitution — Cloud Build scans step text (including
        # comments!) for a dollar sign followed by a name, independent of
        # the leading-underscore convention, so an un-escaped bash variable
        # reference here would be (wrongly) treated as an unset Cloud Build
        # substitution and fail the build before bash even runs. That's why
        # this very comment can't spell out the literal syntax either.
        set -euo pipefail
        SECRETS_FLAG=""
        for NAME in $(gcloud secrets list --format='value(name)'); do
          SECRETS_FLAG="$${SECRETS_FLAG:+$$SECRETS_FLAG,}$$NAME=$$NAME:latest"
        done
        gcloud run deploy $_SERVICE \
          --image=$_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA \
          --region=$_REGION \
          --allow-unauthenticated \
          --env-vars-file=cloud-run.env.yaml \
          --set-secrets="$$SECRETS_FLAG"

options:
  logging: CLOUD_LOGGING_ONLY

images:
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/web:$COMMIT_SHA
  - $_REGION-docker.pkg.dev/$PROJECT_ID/$_REPO/web:latest
